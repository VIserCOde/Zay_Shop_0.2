{% extends 'base.html' %}
{% load static %}

{% block title %} Заказ успешно оформлен {% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <i class="fas fa-check-circle text-success mb-4" style="font-size: 72px;"></i>
        <h1 class="h2 mb-3" style="font-weight: 500; color: #212529;">Thank You for Your Order!</h1>
        <p class="text-muted mb-4" style="font-weight: 300; font-size: 18px;">Your order has been successfully placed.
            Our manager will contact you shortly.</p>
        <a href="{% url 'shop_categories' %}" class="btn btn-success btn-lg rounded-pill px-5"
           style="background-color: #59ab6e; border: none; font-size: 16px;">
            Continue Shopping
        </a>
    </div>
</div>
{% endblock %}
