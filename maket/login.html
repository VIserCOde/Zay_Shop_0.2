<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Zay Shop - Войти в аккаунт</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="assets/css/fontawesome.min.css">

    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;200;300;400;500;700;900&display=swap">

</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="row w-100 justify-content-center">
        <div class="col-md-6 col-lg-4 card shadow-sm p-4 rounded-3 border-0">
            <div class="text-center mb-4">
                <h1 class="h2 text-success pr-1 font-weight-bold"><b>Zay</b> Shop</h1>
                <p class="text-muted">Войдите в свой личный кабинет</p>
            </div>
            <form action="" method="POST">
                <div class="mb-3">
                    <label for="id_username" class="form-label text-secondary">Электронная почта / Логин</label> <input
                        type="text" name="username" class="form-control" id="id_username" required
                        placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label for="id_password" class="form-label text-secondary">Пароль</label>
                        <a href="#" class="text-decoration-none text-success small">Забыли пароль?</a>
                    </div>
                    <input type="password" name="password" class="form-control" id="id_password" required
                           placeholder="••••••••">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label text-muted small" for="remember">Запомнить меня</label>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 mb-3">Войти</button>
            </form>

            <div class="text-center mt-2">
                <span class="text-muted small">Ещё нет аккаунта? </span>
                <a href="register.html" class="text-decoration-none text-success small fw-bold">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
